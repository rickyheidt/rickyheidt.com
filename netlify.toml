# Netlify settings
[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Keep the links in the source exactly as written. Netlify's Pretty URLs
# post-processing rewrites href="about.html" to href="/about", which no longer
# matches the canonical tags and the sitemap (both use the .html address) and
# splits the same page across two internal-link targets.
[build.processing.html]
  pretty_urls = false

# The old Netlify address serves a complete second copy of the site. Send it to
# the real domain so only one version can be crawled and linked to.
[[redirects]]
  from = "https://rickytherealtorsd.netlify.app/*"
  to = "https://rickyheidt.com/:splat"
  status = 301
  force = true
